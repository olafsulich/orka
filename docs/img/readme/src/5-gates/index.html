<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>orka-readme-5-gates</title>
<script type="module">
import { Clip } from '/engine/index.js';

// Step 5: before every verifier round orka runs the repo's static gates. A red gate that also fails on the base commit is only a warning; one that fails only on the branch blocks and goes back to the builder.
const clip = await Clip.create({ duration: 5 });
const B = clip.beat({ build: 0.3, legend: 3.4 });

const start = clip.node({ x: 140, y: 300, name: 'orka worker', sub: '--role verifier', shape: 'pill', type: 'store', minW: 150 });
const gates = clip.node({ x: 420, y: 300, name: 'Static gates', sub: 'lint · typecheck · test', type: 'focal', tag: 'cli', minW: 190 });
const q1 = clip.node({ x: 680, y: 300, name: 'Green?', shape: 'diamond', minW: 100 });
const ver = clip.node({ x: 960, y: 300, name: 'Verifier', sub: 'step 6', shape: 'pill', type: 'store', minW: 130 });
const q2 = clip.node({ x: 680, y: 490, name: 'Fails on\nbase too?', shape: 'diamond', minW: 110 });
const warn = clip.node({ x: 960, y: 490, name: 'Warning', sub: 'preexisting', type: 'optional', minW: 130 });
const back = clip.node({ x: 420, y: 490, name: 'Builder', sub: 'gets the log', tag: 'blocked', minW: 150 });

const a1 = clip.arrow(start, gates);
const a2 = clip.arrow(gates, q1);
const a3 = clip.arrow(q1, ver, { kind: 'accent', label: 'yes' });
const a4 = clip.arrow(q1, q2, { label: 'no', labelSide: 'right' });
const a5 = clip.arrow(q2, warn, { label: 'yes' });
const a6 = clip.arrow(warn, ver, { from: 'top', to: 'bottom', label: 'not blocking', labelSide: 'right' });
const a7 = clip.arrow(q2, back, { kind: 'fail', label: 'no: blocks' });

const legend = clip.legend([
  { shape: 'pill', label: 'Start / next step' }, { node: 'focal', label: 'orka CLI' }, { shape: 'diamond', label: 'Decision' },
  { arrow: 'accent', label: 'Pass' }, { arrow: 'fail', label: 'Block' },
]);

clip.animate((t) => {
  [start, a1, gates, a2, q1, a3, ver, a4, q2, a5, warn, a6, a7, back].forEach((it, i) => it.enter(t, B.build + i * 0.22));
  legend.enter(t, B.legend, 'fade');
});

clip.mount();
</script>
</html>
