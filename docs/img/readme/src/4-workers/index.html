<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>orka-readme-4-workers</title>
<script type="module">
import { Clip } from '/engine/index.js';

// Step 4: the orchestrator starts one builder per task in the shared worktree. Builders only write their result files; orka wakes the orchestrator when a turn ends.
const clip = await Clip.create({ duration: 4.5, skin: 'dark' });
const B = clip.beat({ build: 0.3, legend: 3 });

const orch = clip.node({ x: 120, y: 340, name: 'Orchestrator', sub: 'splits the goal', tag: 'opus', minW: 140 });
const zone = clip.zone({ x: 360, y: 190, w: 320, h: 300, variant: 'dashed', label: 'shared worktree' });
const b1 = clip.node({ x: 520, y: 280, name: 'Builder api', sub: 'one task', tag: 'sonnet', minW: 140 });
const b2 = clip.node({ x: 520, y: 400, name: 'Builder ui', sub: 'one task', tag: 'sonnet', minW: 140 });
const res = clip.node({ x: 860, y: 340, name: 'results/', sub: '<name>.json · notes', type: 'store', minW: 170 });
const wake = clip.node({ x: 860, y: 560, name: 'Finish wake', sub: 'sent by orka', type: 'focal', tag: 'cli', minW: 150 });

const a1 = clip.arrow(orch, b1, { kind: 'accent', fk: 1 / 3, mid: 300, label: 'orka worker', labelSeg: 0 });
const a2 = clip.arrow(orch, b2, { kind: 'accent', fk: 2 / 3, mid: 300 });
const a3 = clip.arrow(b1, res, { tk: 1 / 3, mid: 730 });
const a4 = clip.arrow(b2, res, { tk: 2 / 3, mid: 730 });
const a5 = clip.arrow(res, wake, { from: 'bottom', to: 'top', dashed: true, label: 'turn ended', labelSide: 'right' });
const a6 = clip.arrow(wake, orch, { from: 'left', to: 'bottom', dashed: true, label: 'bounded wake', labelSeg: 0 });

const legend = clip.legend([
  { node: 'focal', label: 'orka CLI' }, { node: 'backend', label: 'Agent' }, { node: 'store', label: 'Files' },
  { arrow: 'accent', label: 'Start' }, { arrow: 'default', dashed: true, label: 'Report' },
]);

clip.animate((t) => {
  orch.enter(t, B.build);
  zone.enter(t, B.build + 0.28, 'fade');
  [a1, b1, a2, b2, a3, a4, res, a5, wake, a6].forEach((it, i) => it.enter(t, B.build + 0.5 + i * 0.24));
  legend.enter(t, B.legend, 'fade');
});

clip.mount();
</script>
</html>
