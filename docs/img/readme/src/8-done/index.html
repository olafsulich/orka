<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>orka-readme-8-done</title>
<script type="module">
import { Clip } from '/engine/index.js';

// Step 8: after your sign-off, orka done sends the finish wake once, frees this job's browsers, servers, worker panes and worktree, and keeps the branch. You merge it (L1), or orka land merges, tests and pushes (L3).
const clip = await Clip.create({ duration: 4.5, skin: 'dark' });
const B = clip.beat({ build: 0.3, legend: 3.2 });

const done = clip.node({ x: 160, y: 320, name: 'orka done', sub: 'needs your sign-off', type: 'focal', tag: 'cli', minW: 170 });
const wake = clip.node({ x: 450, y: 150, name: 'Finish wake', sub: 'webhook POST', type: 'external', tag: 'once', minW: 150 });
const branch = clip.node({ x: 450, y: 320, name: 'orka/<id>', sub: 'branch kept', type: 'store', tag: 'git', minW: 150 });
const freed = clip.node({ x: 450, y: 500, name: 'Freed now', sub: 'browsers · servers\npanes · worktree', type: 'optional', minW: 170 });
const merge = clip.node({ x: 780, y: 240, name: 'You merge', sub: 'L1 (default)', type: 'external', tag: 'ext', minW: 150 });
const land = clip.node({ x: 780, y: 400, name: 'orka land', sub: 'merge · test · push', tag: 'L3', minW: 170 });
const later = clip.node({ x: 780, y: 560, name: 'orka cleanup', sub: 'stale workspaces', type: 'optional', tag: 'later', minW: 170 });

const a1 = clip.arrow(done, wake, { from: 'top', to: 'left', dashed: true, label: 'POST', labelSide: 'left', labelSeg: 0 });
const a2 = clip.arrow(done, branch, { kind: 'accent', label: 'keeps' });
const a3 = clip.arrow(done, freed, { from: 'bottom', to: 'left', label: 'frees', labelSide: 'left', labelSeg: 0 });
const a4 = clip.arrow(branch, merge, { kind: 'accent', tk: 0.5, fk: 1 / 3 });
const a5 = clip.arrow(branch, land, { fk: 2 / 3 });
const a6 = clip.arrow(freed, later, { dashed: true, label: 'later' });

const legend = clip.legend([
  { node: 'focal', label: 'orka CLI' }, { node: 'store', label: 'Kept' }, { node: 'external', label: 'Outside orka' },
  { node: 'optional', label: 'Cleanup' }, { arrow: 'accent', label: 'Main path' }, { arrow: 'default', dashed: true, label: 'Side effect' },
]);

clip.animate((t) => {
  [done, a1, wake, a2, branch, a3, freed, a4, merge, a5, land, a6, later].forEach((it, i) => it.enter(t, B.build + i * 0.22));
  legend.enter(t, B.legend, 'fade');
});

clip.mount();
</script>
</html>
